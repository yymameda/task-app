<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="タスク管理">
<meta name="theme-color" content="#1E5A70">
<title>先生のタスク管理</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --primary: #2D7D9A;
  --primary-dark: #1E5A70;
  --primary-light: #3D9DBF;
  --hdr-h: 60px;
  --bg: #F0F4F8;
  --card: #FFFFFF;
  --text: #1A2B3C;
  --muted: #6B7C8D;
  --border: #DDE3E9;
  --red: #E53E3E;
  --orange: #DD6B20;
  --green: #38A169;
  --shadow: 0 2px 10px rgba(0,0,0,0.09);
  --r: 12px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;height:100vh;height:100dvh;
  overflow:hidden;
}

/* ── MAIN ── */
#main{
  flex:1;overflow:hidden;position:relative;min-height:0;
}
.view{display:none;animation:fadeIn .2s ease;position:absolute;inset:0;}
.view.active{display:block;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
#view-main{flex-direction:column;}
#view-main.active{display:flex;overflow:hidden;}
#view-settings.active,#view-add.active{
  padding:16px 20px calc(32px + var(--safe-bottom));
}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.page-title{display:none;}
#view-add .page-title{display:block;font-size:17px;font-weight:800;padding:10px 0 16px;}

/* ── TOP AREA (quick capture + mini stats) ── */
#top-area{
  flex-shrink:0;padding:10px 14px 8px;
  background:var(--bg);border-bottom:1px solid var(--border);
}
#top-area .qc-btn{margin-bottom:8px;}
#top-area .mini-stats{margin-bottom:0;}

/* ── TASK GRID (2-column) ── */
#task-grid{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:10px 12px calc(20px + var(--safe-bottom));
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  align-content:start;
}
#task-grid .task-item{margin-bottom:0;}

/* ── GLOBAL HEADER ── */
#glb-header{
  flex-shrink:0;height:var(--hdr-h);background:var(--bg);z-index:100;
  display:flex;align-items:center;gap:10px;
  padding:0 12px 0 14px;border-bottom:1px solid var(--border);
}
#back-btn{
  width:40px;height:40px;min-width:40px;border:none;background:transparent;
  display:none;align-items:center;justify-content:center;
  cursor:pointer;color:var(--primary);font-size:24px;
  border-radius:10px;flex-shrink:0;transition:background .15s;line-height:1;
}
#back-btn:active{background:rgba(45,125,154,.1);}
#settings-btn{
  width:44px;height:44px;min-width:44px;border:none;background:transparent;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:22px;border-radius:11px;
  flex-shrink:0;transition:background .15s;
}
#settings-btn:active{background:rgba(0,0,0,.06);}
/* ── SEARCH WRAP ── */
#glb-search-wrap{
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--card);border:2px solid transparent;
  border-radius:14px;padding:0 12px;height:44px;
  box-shadow:var(--shadow);transition:border-color .2s;
}
#glb-search-wrap:focus-within{border-color:var(--primary);}
#glb-search-icon{font-size:19px;opacity:.5;flex-shrink:0;pointer-events:none;}
#search-input{
  flex:1;border:none;background:transparent;outline:none;
  font-size:16px;font-family:inherit;color:var(--text);min-width:0;padding:0;
}
#search-input::placeholder{color:#bbb;}
#search-clear-btn{
  display:none;border:none;background:transparent;
  font-size:18px;font-weight:700;cursor:pointer;
  color:#999;padding:2px 0;flex-shrink:0;line-height:1;
}

/* ── SEARCH OVERLAY (results, positioned below header via JS) ── */
#search-overlay{
  display:none;position:fixed;
  left:0;right:0;bottom:0;
  background:var(--bg);z-index:400;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:12px 20px calc(32px + var(--safe-bottom)) 20px;
  border-top:2px solid var(--primary);
}
#search-overlay.open{display:block;}
#search-count-bar{
  display:none;font-size:13px;font-weight:700;color:var(--primary);
  background:var(--card);border-radius:9px;padding:7px 14px;
  margin-bottom:14px;box-shadow:var(--shadow);
}

/* ── STAT CARDS ── */
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.stat-card{
  background:var(--card);border-radius:var(--r);padding:18px 14px;
  box-shadow:var(--shadow);text-align:center;
}
.stat-num{font-size:38px;font-weight:800;color:var(--primary);line-height:1.1;}
.stat-num.red{color:var(--red);}
.stat-label{font-size:12px;color:var(--muted);margin-top:5px;font-weight:600;}

/* ── SECTION HEADER ── */
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.sec-title{font-size:15px;font-weight:700;color:var(--text);}

/* ── TASK ITEM ── */
.task-item{
  background:var(--card);border-radius:var(--r);padding:13px 14px;
  box-shadow:var(--shadow);margin-bottom:9px;
  display:flex;align-items:flex-start;gap:11px;
  cursor:pointer;transition:transform .15s,box-shadow .15s;
  border-left:4px solid transparent;
}
.task-item:active{transform:scale(.985);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.task-item.urg-高{border-left-color:var(--red);}
.task-item.urg-中{border-left-color:var(--orange);}
.task-item.urg-低{border-left-color:var(--green);}
.task-item.done-item{opacity:.55;}

.t-check{
  width:24px;height:24px;min-width:24px;border:2.5px solid var(--border);border-radius:7px;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
  transition:background .2s,border-color .2s;cursor:pointer;
}
.t-check.checked{background:var(--primary);border-color:var(--primary);}
.t-check.checked::after{
  content:'';width:11px;height:7px;
  border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;
  transform:rotate(-45deg) translateY(-1.5px);display:block;
}
.t-body{flex:1;min-width:0;}
.t-title{
  font-size:15px;font-weight:600;color:var(--text);
  margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.done-item .t-title{text-decoration:line-through;color:var(--muted);}
.t-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.bu-高{background:#FEE2E2;color:#9B1C1C;}
.bu-中{background:#FEF3C7;color:#78350F;}
.bu-低{background:#DCFCE7;color:#14532D;}
.bi-高{background:#EDE9FE;color:#4C1D95;}
.bi-中{background:#E0F2FE;color:#0C4A6E;}
.bi-低{background:#F1F5F9;color:#334155;}
.bs{background:#F0FDF4;color:#14532D;}
.t-dl{font-size:12px;color:var(--muted);}
.t-dl.ov{color:var(--red);font-weight:700;}
.t-dl.td{color:var(--orange);font-weight:700;}

/* ── TABS ── */
.tabs{display:flex;gap:4px;background:#E2E8F0;padding:4px;border-radius:11px;margin-bottom:14px;}
.tab-btn{
  flex:1;padding:9px 4px;border:none;background:transparent;border-radius:8px;
  font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:background .2s,color .2s;
  font-family:inherit;
}
.tab-btn.active{background:#fff;color:var(--primary);box-shadow:0 1px 5px rgba(0,0,0,.09);}

/* ── FORM ── */
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);}
.form-group{margin-bottom:15px;}
label.fl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.3px;}
input[type=text],input[type=date],input[type=password],select,textarea{
  width:100%;padding:12px 14px;
  border:2px solid var(--border);border-radius:10px;
  font-size:15px;font-family:inherit;color:var(--text);background:#fff;
  outline:none;transition:border-color .2s;
  -webkit-appearance:none;appearance:none;
}
input[type=date]{-webkit-appearance:none;}
input:focus,select:focus,textarea:focus{border-color:var(--primary);}
textarea{min-height:90px;resize:vertical;line-height:1.5;}
.sel-wrap{position:relative;}
.sel-wrap::after{
  content:'▾';position:absolute;right:13px;top:50%;transform:translateY(-50%);
  color:var(--muted);pointer-events:none;font-size:13px;
}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.repeat-days{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.day-chip{
  padding:6px 11px;border-radius:20px;font-size:13px;font-weight:700;
  border:2px solid var(--border);background:#fff;cursor:pointer;color:var(--muted);
  font-family:inherit;transition:background .15s,color .15s,border-color .15s;
}
.day-chip.selected{background:var(--primary);color:#fff;border-color:var(--primary);}

/* ── BUTTONS ── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 20px;border:none;border-radius:11px;
  font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
  transition:opacity .2s,transform .15s;
}
.btn:active{opacity:.82;transform:scale(.97);}
.btn-p{background:linear-gradient(135deg,#2D7D9A,#1E5A70);color:#fff;box-shadow:0 3px 12px rgba(30,90,112,.35);}
.btn-s{background:#E8EDF2;color:var(--text);}
.btn-d{background:#FEE2E2;color:#991B1B;}
.btn-g{background:#DCFCE7;color:#14532D;}
.btn-w{width:100%;margin-bottom:10px;}

/* ── MODAL ── */
#modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(15,30,45,.55);z-index:500;
  align-items:flex-end;justify-content:center;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}
#modal-overlay.open{display:flex;}
#modal{
  background:#fff;border-radius:22px 22px 0 0;
  width:100%;max-width:700px;
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:20px 22px calc(28px + var(--safe-bottom)) 22px;
  animation:slideUp .28s cubic-bezier(.2,.8,.4,1);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:38px;height:4px;background:#DDE3E9;border-radius:2px;margin:0 auto 18px;}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-title{font-size:17px;font-weight:800;}
.modal-x{
  width:30px;height:30px;border:none;background:#EEF2F7;border-radius:50%;
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);
}

/* ── DETAIL ROWS ── */
.d-row{display:flex;justify-content:space-between;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border);}
.d-row:last-child{border-bottom:none;}
.d-lbl{font-size:13px;color:var(--muted);font-weight:600;}
.d-val{font-size:14px;color:var(--text);text-align:right;max-width:62%;word-break:break-word;}
.d-memo{font-size:14px;color:var(--text);line-height:1.6;margin-top:6px;padding:10px;background:#F8FAFC;border-radius:8px;white-space:pre-wrap;}
.modal-acts{display:flex;gap:10px;margin-top:18px;}

/* ── PASSWORD DIALOG ── */
#pwd-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(15,30,45,.6);z-index:600;
  align-items:center;justify-content:center;padding:20px;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
#pwd-overlay.open{display:flex;}
#pwd-dialog{
  background:#fff;border-radius:18px;padding:26px 22px;
  width:100%;max-width:360px;
  animation:fadeIn .2s ease;
}
#pwd-dialog h3{font-size:17px;font-weight:800;margin-bottom:6px;}
#pwd-dialog p{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
.pwd-acts{display:flex;gap:10px;margin-top:14px;}

/* ── TOAST ── */
#toast-cont{
  position:fixed;bottom:calc(24px + var(--safe-bottom));left:50%;
  transform:translateX(-50%);z-index:900;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
}
.toast{
  background:#1A2B3C;color:#fff;padding:11px 22px;border-radius:24px;
  font-size:14px;font-weight:600;white-space:nowrap;
  animation:tIn .28s ease,tOut .28s ease 2.2s forwards;
  box-shadow:0 4px 18px rgba(0,0,0,.22);
}
.toast.ok{background:#14532D;}
.toast.err{background:#991B1B;}
@keyframes tIn{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes tOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-8px) scale(.9)}}

/* ── COMPLETED VIEW ── */
.done-card{
  background:var(--card);border-radius:var(--r);padding:13px 15px;
  box-shadow:var(--shadow);margin-bottom:9px;
}
.done-title{font-size:14px;font-weight:600;color:var(--muted);text-decoration:line-through;margin-bottom:5px;}
.done-meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;}

/* ── BACKUP VIEW ── */
.bk-sec{margin-bottom:26px;}
.bk-sec h3{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.file-input-wrap{position:relative;overflow:hidden;}
.file-input-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:100px;}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:52px 20px;color:var(--muted);}
.empty .ei{font-size:52px;margin-bottom:12px;}
.empty p{font-size:15px;line-height:1.6;}

/* ── WALL VIEW ── */
.wall-section{margin-bottom:5px;}
.wall-sec-header{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.wall-sec-badge{font-size:8px;font-weight:800;padding:4px 10px;border-radius:20px;}
.wall-sec-count{font-size:8px;color:var(--muted);font-weight:600;}
.wall-task-card{
  background:var(--card);border-radius:10px;padding:3px 6px;margin-bottom:2px;
  display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);
  border-left:4px solid transparent;
}
.wall-task-card.urg-高{border-left-color:var(--red);}
.wall-task-card.urg-中{border-left-color:var(--orange);}
.wall-task-card.urg-低{border-left-color:var(--green);}
.wall-task-card.future{padding:2px 6px;margin-bottom:2px;border-left-width:2px;background:#F8FAFC;box-shadow:none;}
.wall-task-card.future .wall-task-title{font-size:10px;color:var(--muted);}
.wall-task-card.future .wall-date-label{font-size:9px;}
.wall-task-title{
  font-size:11px;font-weight:600;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.wall-task-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;flex-shrink:0;}
#wall-footer{font-size:12px;color:var(--muted);text-align:center;margin-top:20px;cursor:pointer;}

/* ── HABIT BADGE ── */
.b-habit{background:#EDE9FE;color:#4C1D95;}
.b-handover{background:#FEF9C3;color:#713F12;}
.b-asgn-yamada{background:#DBEAFE;color:#1E40AF;}
.b-asgn-self{background:#FEF9C3;color:#854D0E;}
.b-asgn-all{background:#F0FDF4;color:#166534;}

/* ── SECRETARY VIEW ── */
.secretary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.sec-action-btn{
  background:var(--card);border:2px solid transparent;border-radius:var(--r);
  padding:22px 10px;box-shadow:var(--shadow);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:transform .15s,box-shadow .15s;font-family:inherit;width:100%;
}
.sec-action-btn:active{transform:scale(.97);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.sec-action-btn.recording{background:#FEE2E2;border-color:#E53E3E;animation:sec-pulse 1s infinite;}
@keyframes sec-pulse{0%,100%{opacity:1}50%{opacity:.6}}
.sec-btn-icon{font-size:36px;line-height:1;}
.sec-btn-label{font-size:13px;font-weight:700;color:var(--text);}
.sec-status-card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
.sec-preview-img{width:100%;border-radius:10px;margin-bottom:12px;max-height:260px;object-fit:contain;background:#F0F4F8;}
.sec-hist-item{background:var(--card);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow);margin-bottom:9px;}
.sec-hist-date{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:7px;}
.sec-hist-point{font-size:13px;color:var(--text);line-height:1.7;padding-left:14px;position:relative;}
.sec-hist-point::before{content:'・';position:absolute;left:0;}

/* ── NEXT TASK CARD ── */
.next-task-card{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  border-radius:var(--r);padding:18px;
  box-shadow:0 4px 18px rgba(30,90,112,.38);margin-bottom:14px;cursor:pointer;
  transition:transform .15s,box-shadow .15s;
}
.next-task-card:active{transform:scale(.985);box-shadow:0 2px 8px rgba(30,90,112,.2);}
.next-task-label{font-size:10px;font-weight:800;color:rgba(255,255,255,.7);
  letter-spacing:.6px;text-transform:uppercase;margin-bottom:7px;}
.next-task-title{font-size:19px;font-weight:800;color:#fff;line-height:1.3;margin-bottom:10px;}
.next-task-meta{display:flex;gap:6px;flex-wrap:wrap;}
.next-task-badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;
  background:rgba(255,255,255,.22);color:#fff;}
/* ── MINI STATS ── */
.mini-stats{display:flex;gap:8px;margin-bottom:16px;}
.mini-stat{flex:1;background:var(--card);border-radius:10px;padding:10px 8px;
  box-shadow:var(--shadow);text-align:center;}
.mini-stat-num{font-size:26px;font-weight:800;color:var(--primary);line-height:1;}
.mini-stat-num.red{color:var(--red);}
.mini-stat-label{font-size:10px;color:var(--muted);margin-top:3px;font-weight:600;}
/* ── UPCOMING ROW ── */
.upcoming-date-hdr{font-size:12px;font-weight:700;color:var(--muted);
  margin:10px 0 4px;padding-left:2px;}
/* ── QUICK CAPTURE ── */
.qc-btn{
  width:100%;padding:14px;border:2px dashed var(--border);border-radius:var(--r);
  background:var(--card);color:var(--primary);cursor:pointer;font-family:inherit;
  font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;
  margin-bottom:14px;transition:background .15s,border-color .15s;
  box-shadow:var(--shadow);
}
.qc-btn:active{background:#EEF6FA;border-color:var(--primary);}
.qc-form{
  background:var(--card);border-radius:var(--r);padding:14px;
  box-shadow:var(--shadow);margin-bottom:14px;
  animation:fadeIn .15s ease;
}
.qc-input{
  width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:10px;
  font-size:16px;font-family:inherit;color:var(--text);background:#fff;
  outline:none;transition:border-color .2s;
}
.qc-input:focus{border-color:var(--primary);}
/* ── INBOX ── */
.inbox-toggle{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border-radius:var(--r);padding:12px 16px;
  box-shadow:var(--shadow);cursor:pointer;margin-top:4px;
  border-left:4px solid #A0AEC0;
}
.inbox-toggle:active{opacity:.8;}
.inbox-label{font-size:13px;font-weight:700;color:var(--text);}
.inbox-meta{font-size:12px;color:var(--muted);}
/* ── CALENDAR EVENTS ── */
.cal-event-card{
  background:#F0F9FF;border-radius:10px;padding:10px 13px;margin-bottom:7px;
  display:flex;align-items:center;gap:10px;
  border-left:4px solid var(--primary);
}
.cal-event-icon{font-size:15px;flex-shrink:0;}
.cal-event-body{flex:1;min-width:0;}

<script>
'use strict';

// ═══════════════════════════════════════════════
//  STORAGE MANAGER (IndexedDB + localStorage)
// ═══════════════════════════════════════════════
const IS_STANDALONE =
  navigator.standalone === true ||
  window.matchMedia('(display-mode: standalone)').matches;

const StorageManager = (() => {
  const DB_NAME = 'TeacherTasksDB';
  const DB_VER  = 1;
  const STORE   = 'tasks';
  const LS_KEY  = 'teacher_tasks_v1';
  let _db = null;
  let _mem = [];

  function initDB() {
    if (!IS_STANDALONE) return Promise.resolve(false);
    return new Promise((resolve) => {
      if (!window.indexedDB) { resolve(false); return; }
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains(STORE))
          d.createObjectStore(STORE, { keyPath: 'id' });
      };
      req.onsuccess = (e) => { _db = e.target.result; resolve(true); };
      req.onerror   = ()  => resolve(false);
    });
  }

  function getAll() {
    if (_db) return new Promise((res) => {
      const r = _db.transaction(STORE,'readonly').objectStore(STORE).getAll();
      r.onsuccess = () => res(r.result || []);
      r.onerror   = () => res(lsGetAll());
    });
    return Promise.resolve(lsGetAll());
  }

  function save(task) {
    if (_db) return new Promise((res) => {
      const r = _db.transaction(STORE,'readwrite').objectStore(STORE).put(task);
      r.onsuccess = () => res(true);
      r.onerror   = () => { lsSave(task); res(true); };
    });
    lsSave(task);
    return Promise.resolve(true);
  }

  function remove(id) {
    if (_db) return new Promise((res) => {
      const r = _db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);
      r.onsuccess = () => res(true);
      r.onerror   = () => { lsRemove(id); res(true); };
    });
    lsRemove(id);
    return Promise.resolve(true);
  }

  function clear() {
    if (_db) return new Promise((res) => {
      const r = _db.transaction(STORE,'readwrite').objectStore(STORE).clear();
      r.onsuccess = () => res(true);
      r.onerror   = () => res(false);
    });
    localStorage.removeItem(LS_KEY);
    return Promise.resolve(true);
  }

  function lsGetAll() {
    if (!IS_STANDALONE) return _mem;
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
    catch { return []; }
  }
  function lsSave(task) {
    if (!IS_STANDALONE) {
      const i = _mem.findIndex(t => t.id === task.id);
      if (i >= 0) _mem[i] = task; else _mem.push(task);
      return;
    }
    const tasks = lsGetAll();
    const i = tasks.findIndex(t => t.id === task.id);
    if (i >= 0) tasks[i] = task; else tasks.push(task);
    localStorage.setItem(LS_KEY, JSON.stringify(tasks));
  }
  function lsRemove(id) {
    if (!IS_STANDALONE) { _mem = _mem.filter(t => t.id !== id); return; }
    localStorage.setItem(LS_KEY, JSON.stringify(lsGetAll().filter(t => t.id !== id)));
  }

  return { initDB, getAll, save, remove, clear };
})();

// ═══════════════════════════════════════════════
//  CRYPTO MANAGER (AES-GCM 256-bit)
// ═══════════════════════════════════════════════
const CryptoManager = (() => {
  const ENC = new TextEncoder();
  const DEC = new TextDecoder();

  function toB64(buf) {
    let s = '';
    const u = new Uint8Array(buf);
    for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
    return btoa(s);
  }
  function fromB64(b64) {
    const s = atob(b64);
    const u = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return u;
  }

  async function deriveKey(password, salt) {
    const km = await crypto.subtle.importKey(
      'raw', ENC.encode(password), 'PBKDF2', false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:210000, hash:'SHA-256' },
      km,
      { name:'AES-GCM', length:256 },
      false, ['encrypt','decrypt']
    );
  }

  async function encrypt(data, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv   = crypto.getRandomValues(new Uint8Array(12));
    const key  = await deriveKey(password, salt);
    const ct   = await crypto.subtle.encrypt(
      { name:'AES-GCM', iv },
      key,
      ENC.encode(JSON.stringify(data))
    );
    const combined = new Uint8Array(16 + 12 + ct.byteLength);
    combined.set(salt, 0);
    combined.set(iv,  16);
    combined.set(new Uint8Array(ct), 28);
    return toB64(combined);
  }

  async function decrypt(b64Data, password) {
    const combined = fromB64(b64Data);
    const salt = combined.slice(0, 16);
    const iv   = combined.slice(16, 28);
    const ct   = combined.slice(28);
    const key  = await deriveKey(password, salt);
    const pt   = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ct);
    return JSON.parse(DEC.decode(pt));
  }

  return { encrypt, decrypt };
})();

// ═══════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function weekEnd() {
  const d = new Date();
  // 今週の金曜日までの日数: (5 - day + 7) % 7
  // 日(0)→5, 月(1)→4, 火(2)→3, 水(3)→2, 木(4)→1, 金(5)→0, 土(6)→6(翌週金)
  const daysToFriday = (5 - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + daysToFriday);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDateJP(s) {
  if (!s) return '';
  const [y,m,d] = s.split('-');
  return `${y}年${parseInt(m)}月${parseInt(d)}日`;
}

function formatDateTimeJP(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function daysDiff(from, to) {
  const a = new Date(from), b = new Date(to);
  return Math.round((b - a) / 86400000);
}

function urgScore(u)  { return u==='高'?0:u==='中'?1:2; }
function impScore(i)  { return i==='高'?0:i==='中'?1:2; }
function totalScore(t){ return urgScore(t.urgency)*3 + impScore(t.importance); }

function sortTasks(arr) {
  return [...arr].sort((a, b) => totalScore(a) - totalScore(b));
}

function deadlineClass(dl) {
  if (!dl) return '';
  const t = today();
  if (dl < t) return 'ov';
  if (dl === t) return 'td';
  return '';
}

function deadlineLabel(dl) {
  if (!dl) return '';
  const t = today();
  if (dl < t) return `⚠ 期限超過 (${formatDateJP(dl)})`;
  if (dl === t) return `⏰ 今日 (${formatDateJP(dl)})`;
  const diff = daysDiff(t, dl);
  return `📅 ${formatDateJP(dl)}（あと${diff}日）`;
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function clearSearch() {
  const inp = document.getElementById('search-input');
  inp.value = '';
  document.getElementById('search-clear-btn').style.display = 'none';
  document.getElementById('search-overlay').classList.remove('open');
  document.getElementById('search-results').innerHTML = '';
  document.getElementById('search-count-bar').style.display = 'none';
}

function _openSearchOverlay() {
  const hdr = document.getElementById('glb-header');
  const top = hdr ? hdr.getBoundingClientRect().bottom : 70;
  const ov  = document.getElementById('search-overlay');
  ov.style.top = top + 'px';
  ov.classList.add('open');
}

function performSearch() {
  const inp = document.getElementById('search-input');
  const q   = inp.value.trim().toLowerCase();
  const cb  = document.getElementById('search-count-bar');
  const re  = document.getElementById('search-results');
  const clr = document.getElementById('search-clear-btn');
  clr.style.display = q ? 'block' : 'none';
  if (!q) {
    document.getElementById('search-overlay').classList.remove('open');
    cb.style.display = 'none'; re.innerHTML = ''; return;
  }

  const matched = tasks.filter(t =>
    (t.title    || '').toLowerCase().includes(q) ||
    (t.memo     || '').toLowerCase().includes(q) ||
    (t.source   || '').toLowerCase().includes(q) ||
    (t.contact  || '').toLowerCase().includes(q) ||
    (t.assignee || '').toLowerCase().includes(q)
  );
  const hist = IS_STANDALONE ? JSON.parse(localStorage.getItem('secretary_history') || '[]') : [];
  const histHits = hist.reduce((acc, h) => {
    const pts = h.points.filter(p => p.toLowerCase().includes(q));
    if (pts.length) acc.push({ date: h.date, points: pts });
    return acc;
  }, []);
  const histCount = histHits.reduce((n, h) => n + h.points.length, 0);
  const total = matched.length + histCount;

  if (total === 0) {
    cb.textContent = '0件'; cb.style.display = '';
    re.innerHTML = `<div class="empty"><div class="ei">🔍</div><p>該当するタスクはありません</p></div>`;
    return;
  }
  cb.textContent = `${total}件見つかりました`; cb.style.display = '';

  const active = matched.filter(t => t.status !== '完了');
  const done   = matched.filter(t => t.status === '完了');
  let html = '';
  if (active.length) {
    html += `<div class="sec-title" style="margin-bottom:8px;">未完了タスク（${active.length}件）</div>`;
    html += sortTasks(active).map(t => taskCard(t)).join('');
  }
  if (done.length) {
    html += `<div class="sec-title" style="margin:14px 0 8px;">完了済み（${done.length}件）</div>`;
    html += done.map(t => `<div class="done-card" onclick="openModal('${esc(t.id)}')">
      <div class="done-title">${esc(t.title)}</div>
      <div class="done-meta">
        <span class="badge bu-${esc(t.urgency)}">緊急${esc(t.urgency)}</span>
        ${t.completedAt ? `<span>✅ ${formatDateTimeJP(t.completedAt)}</span>` : ''}
      </div>
    </div>`).join('');
  }
  if (histHits.length) {
    html += `<div class="sec-title" style="margin:14px 0 8px;">要点履歴（${histCount}件）</div>`;
    html += histHits.map(h => `<div class="sec-hist-item">
      <div class="sec-hist-date">📅 ${formatDateTimeJP(h.date)}</div>
      ${h.points.map(p => `<div class="sec-hist-point">${esc(p)}</div>`).join('')}
    </div>`).join('');
  }
  re.innerHTML = html;
  _openSearchOverlay();
}

function nav(view) {
  // エイリアス変換
  if (view === 'secretary' || view === 'backup') view = 'settings';
  if (['done','list','wall','dashboard'].includes(view)) view = 'main';

  if (_wakeLock) { _wakeLock.release().catch(() => {}); _wakeLock = null; }

  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const viewEl = document.getElementById('view-' + view);
  if (viewEl) viewEl.classList.add('active');

  currentView = view;
  const saveView = (view === 'add') ? 'main' : view;
  if (IS_STANDALONE) localStorage.setItem('last_view', saveView);

  // ヘッダーボタン表示切り替え
  const backBtn = document.getElementById('back-btn');
  const settBtn = document.getElementById('settings-btn');
  if (backBtn) backBtn.style.display = (view !== 'main') ? 'flex' : 'none';
  if (settBtn) settBtn.style.display = (view === 'main') ? 'flex' : 'none';

  // フォームタイトル更新
  if (view === 'add') {
    const ft = document.getElementById('form-title');
    if (ft) ft.textContent = editingId ? 'タスクを編集' : isDuplicate ? 'タスクを追加（複製）' : 'タスクを追加';
  }

  if (view === 'main')     renderMain();
  if (view === 'settings') renderSecretary();
  if (view === 'add' && !editingId) {
    if (isDuplicate) { isDuplicate = false; }
    else { resetForm(); }
  }
}

function toggleSettingsView() {
  nav(currentView === 'settings' ? 'main' : 'settings');
}

async function acquireWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      _wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) { /* 非対応環境では無視 */ }
}

function wallTaskCard(t, showDate, isFuture) {
  const dateHtml = showDate && t.deadline
    ? `<span class="wall-date-label" style="font-size:10px;color:var(--muted);font-weight:600;white-space:nowrap;margin-right:6px;flex-shrink:0;">${esc(formatDateJP(t.deadline))}</span>`
    : '';
  const futureClass = isFuture ? ' future' : '';
  const badgeHtml = isFuture ? '' : `<span class="wall-task-badge bu-${esc(t.urgency)}">緊急${esc(t.urgency)}</span>`;
  return `<div class="wall-task-card urg-${esc(t.urgency)}${futureClass}" onclick="openModal('${esc(t.id)}')">
    ${dateHtml}<span class="wall-task-title" style="flex:1;">${esc(t.title)}</span>
    ${badgeHtml}
  </div>`;
}

function renderWallSection(sectionId, listId, countId, items, showDate) {
  const section = document.getElementById(sectionId);
  if (!items.length) { section.style.display = 'none'; return; }
  section.style.display = '';
  document.getElementById(countId).textContent = `${items.length}件`;
  document.getElementById(listId).innerHTML = sortTasks(items).map(t => wallTaskCard(t, showDate)).join('');
}

function renderWall() {
  const todayStr = today();

  const tom = new Date();
  tom.setDate(tom.getDate() + 1);
  const tomorrowStr = `${tom.getFullYear()}-${String(tom.getMonth()+1).padStart(2,'0')}-${String(tom.getDate()).padStart(2,'0')}`;

  const we = weekEnd();
  const active = tasks.filter(x => x.status !== '完了');

  const overdue  = active.filter(x => x.deadline && x.deadline <  todayStr);
  const todayT   = active.filter(x => x.deadline === todayStr);
  const tomorrowT= active.filter(x => x.deadline === tomorrowStr);
  const weekT    = active.filter(x => x.deadline && x.deadline > tomorrowStr && x.deadline <= we);
  const futureT  = active.filter(x => x.deadline && x.deadline > we);
  const someday  = active.filter(x => !x.deadline);

  renderWallSection('wall-overdue',  'wall-overdue-list',  'wall-overdue-count',  overdue,   true);
  renderWallSection('wall-today',    'wall-today-list',    'wall-today-count',    todayT,    false);
  renderWallSection('wall-tomorrow', 'wall-tomorrow-list', 'wall-tomorrow-count', tomorrowT, true);
  renderWallSection('wall-week',     'wall-week-list',     'wall-week-count',     weekT,     true);

  const futureSection = document.getElementById('wall-future');
  if (!futureT.length) {
    futureSection.style.display = 'none';
  } else {
    futureSection.style.display = '';
    document.getElementById('wall-future-count').textContent = `${futureT.length}件`;
    futureT.sort((a, b) => a.deadline.localeCompare(b.deadline));
    document.getElementById('wall-future-list').innerHTML = futureT.map(t => wallTaskCard(t, true, true)).join('');
  }

  renderWallSection('wall-someday', 'wall-someday-list', 'wall-someday-count', someday, false);
}

// ═══════════════════════════════════════════════
//  CALENDAR (iCal)
// ═══════════════════════════════════════════════
const CAL_LS_URL    = 'cal_ical_url';
const CAL_LS_EVENTS = 'cal_events';
const CAL_LS_LAST   = 'cal_last_loaded';

function parseIcalDate(val) {
  if (!val) return null;
  const v = val.trim();
  if (/^\d{8}$/.test(v))   return `${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`;
  if (/^\d{8}T/.test(v))   return `${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`;
  return null;
}

function parseIcal(text) {
  const unfolded = text
    .replace(/\r\n/g, '\n')
    .replace(/\n[ \t]/g, '');
  const events = [];
  const re = /BEGIN:VEVENT\n([\s\S]*?)END:VEVENT/g;
  let m;
  while ((m = re.exec(unfolded)) !== null) {
    const block = m[1];
    let dtstart = '', summary = '';
    for (const line of block.split('\n')) {
      const ci = line.indexOf(':');
      if (ci < 0) continue;
      const key = line.slice(0, ci).toUpperCase();
      const val = line.slice(ci + 1);
      if (key === 'DTSTART' || key.startsWith('DTSTART;')) dtstart = val;
      else if (key === 'SUMMARY' || key.startsWith('SUMMARY;')) summary = val;
    }
    const date = parseIcalDate(dtstart);
    if (!date) continue;
    const title = summary
      .replace(/\\,/g, ',').replace(/\\n/g, ' ').replace(/\\\\/g, '\\').trim();
    if (!title) continue;
    events.push({ date, title });
  }
  return events;
}

async function loadCalendar() {
  const urlInput = document.getElementById('cal-url-input');
  const url = urlInput ? urlInput.value.trim() : '';
  if (!url) { showToast('URLを入力してください', 'err'); return; }
  const statusEl = document.getElementById('cal-status');
  if (statusEl) statusEl.textContent = '読み込み中…';

  let text;
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    text = await r.text();
  } catch {
    try {
      const proxy = 'https://corsproxy.io/?url=' + encodeURIComponent(url);
      const r2 = await fetch(proxy, { cache: 'no-store' });
      if (!r2.ok) throw new Error('HTTP ' + r2.status);
      text = await r2.text();
    } catch (e2) {
      showToast('取得失敗: ' + e2.message, 'err');
      if (statusEl) statusEl.textContent = 'エラー: ' + e2.message;
      return;
    }
  }

  const todayStr = today();
  const d60 = new Date(); d60.setDate(d60.getDate() + 60);
  const d60Str = fmtDate(d60);
  const filtered = parseIcal(text)
    .filter(e => e.date >= todayStr && e.date <= d60Str)
    .sort((a, b) => a.date.localeCompare(b.date));

  localStorage.setItem(CAL_LS_URL,    url);
  localStorage.setItem(CAL_LS_EVENTS, JSON.stringify(filtered));
  const now = new Date().toISOString();
  localStorage.setItem(CAL_LS_LAST,   now);
  if (statusEl) statusEl.textContent = `${filtered.length}件取得 • ${formatDateTimeJP(now)}`;
  showToast(`${filtered.length}件のイベントを読み込みました`, 'ok');
  if (currentView === 'main') renderMain();
}

function clearCalendar() {
  localStorage.removeItem(CAL_LS_URL);
  localStorage.removeItem(CAL_LS_EVENTS);
  localStorage.removeItem(CAL_LS_LAST);
  const urlInput = document.getElementById('cal-url-input');
  if (urlInput) urlInput.value = '';
  const statusEl = document.getElementById('cal-status');
  if (statusEl) statusEl.textContent = '';
  showToast('カレンダー設定をクリアしました');
  if (currentView === 'main') renderMain();
}

function renderCalendarSettings() {
  const urlInput = document.getElementById('cal-url-input');
  const statusEl = document.getElementById('cal-status');
  if (urlInput) urlInput.value = localStorage.getItem(CAL_LS_URL) || '';
  const last   = localStorage.getItem(CAL_LS_LAST);
  const events = JSON.parse(localStorage.getItem(CAL_LS_EVENTS) || '[]');
  if (statusEl) {
    statusEl.textContent = last
      ? `${events.length}件取得済み • ${formatDateTimeJP(last)}`
      : '';
  }
}

function renderCalendarSection() {
  const section = document.getElementById('cal-section');
  if (!section) return;
  if (!localStorage.getItem(CAL_LS_URL)) { section.style.display = 'none'; return; }

  const todayStr = today();
  const d60 = new Date(); d60.setDate(d60.getDate() + 60);
  const d60Str = fmtDate(d60);
  const events = JSON.parse(localStorage.getItem(CAL_LS_EVENTS) || '[]')
    .filter(e => e.date >= todayStr && e.date <= d60Str)
    .slice(0, 10);

  if (!events.length) { section.style.display = 'none'; return; }
  section.style.display = '';
  const countEl = document.getElementById('cal-event-count');
  if (countEl) countEl.textContent = `${events.length}件`;
  const listEl = document.getElementById('cal-event-list');
  if (listEl) {
    listEl.innerHTML = events.map(ev => {
      const diff = daysDiff(todayStr, ev.date);
      const isToday = diff === 0;
      const label = isToday ? '今日' : diff === 1 ? '明日' : `あと${diff}日`;
      return `<div class="cal-event-card">
        <span class="cal-event-icon">📅</span>
        <div class="cal-event-body">
          <div class="cal-event-title">${esc(ev.title)}</div>
          <div class="cal-event-meta">${formatDateJP(ev.date)}</div>
        </div>
        <span class="cal-event-days${isToday ? ' today' : ''}">${esc(label)}</span>
      </div>`;
    }).join('');
  }
}

// ═══════════════════════════════════════════════
//  RENDER MAIN (2列グリッド)
// ═══════════════════════════════════════════════
function renderMain() {
  const todayStr = today();
  const d3 = new Date(); d3.setDate(d3.getDate() + 3);
  const d3Str = fmtDate(d3);
  const active = tasks.filter(x => x.status !== '完了');

  // ミニ統計
  const todayCount = active.filter(x => x.deadline && x.deadline <= todayStr).length;
  const nearCount  = active.filter(x => x.deadline && x.deadline > todayStr && x.deadline <= d3Str).length;
  const tdEl = document.getElementById('stat-today');
  const nrEl = document.getElementById('stat-near');
  const ttEl = document.getElementById('stat-total');
  if (tdEl) tdEl.textContent = todayCount;
  if (nrEl) nrEl.textContent = nearCount;
  if (ttEl) ttEl.textContent = active.length;

  // タスクグリッド
  const el = document.getElementById('task-grid');
  if (!el) return;
  if (!active.length) {
    el.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="ei">🎉</div><p>未完了タスクはありません</p></div>`;
    return;
  }
  el.innerHTML = sortTasks(active).map(t => taskCard(t)).join('');
}

function renderDashboard() { renderMain(); }

// ═══════════════════════════════════════════════
//  RENDER LIST
// ═══════════════════════════════════════════════
function renderList() {
  const el = document.getElementById('list-container');

  if (currentTab === 'done') {
    const done = tasks.filter(x => x.status === '完了')
      .sort((a,b) => (b.completedAt||'').localeCompare(a.completedAt||''));
    if (!done.length) {
      el.innerHTML = `<div class="empty"><div class="ei">📂</div><p>完了済みタスクはありません</p></div>`;
      return;
    }
    el.innerHTML = done.map(t => {
      const days = (t.createdAt && t.completedAt)
        ? daysDiff(t.createdAt.slice(0,10), t.completedAt.slice(0,10)) : null;
      return `<div class="done-card" onclick="openModal('${esc(t.id)}')">
        <div class="done-title">${esc(t.title)}</div>
        <div class="done-meta">
          <span class="badge bu-${esc(t.urgency)}">緊急${esc(t.urgency)}</span>
          <span class="badge bi-${esc(t.importance)}">重要${esc(t.importance)}</span>
          ${t.completedAt ? `<span>✅ ${formatDateTimeJP(t.completedAt)}</span>` : ''}
          ${days !== null ? `<span>⏱ 所要${days}日</span>` : ''}
        </div>
      </div>`;
    }).join('');
    return;
  }

  const t = today(), we = weekEnd();
  const active = tasks.filter(x => x.status !== '完了');
  let filtered;
  if (currentTab === 'today') {
    filtered = active.filter(x => x.deadline && x.deadline <= t);
  } else if (currentTab === 'week') {
    filtered = active.filter(x => x.deadline && x.deadline > t && x.deadline <= we);
  } else {
    filtered = active.filter(x => !x.deadline || x.deadline > we);
  }
  const sorted = sortTasks(filtered);
  if (!sorted.length) {
    const msgs = { today:'今日締切のタスクはありません', week:'今週締切のタスクはありません', future:'その他のタスクはありません' };
    el.innerHTML = `<div class="empty"><div class="ei">📭</div><p>${msgs[currentTab]}</p></div>`;
    return;
  }
  el.innerHTML = sorted.map(t => taskCard(t)).join('');
}

// ═══════════════════════════════════════════════
//  RENDER DONE
// ═══════════════════════════════════════════════
function renderDone() {
  const done = tasks.filter(x => x.status === '完了')
    .sort((a,b) => (b.completedAt||'').localeCompare(a.completedAt||''));
  const el = document.getElementById('done-list');
  if (!done.length) {
    el.innerHTML = `<div class="empty"><div class="ei">📂</div><p>完了済みタスクはありません</p></div>`;
    return;
  }
  el.innerHTML = done.map(t => {
    const days = (t.createdAt && t.completedAt)
      ? daysDiff(t.createdAt.slice(0,10), t.completedAt.slice(0,10))
      : null;
    const daysStr = days !== null ? `所要${days}日` : '';
    return `<div class="done-card" onclick="openModal('${esc(t.id)}')">
      <div class="done-title">${esc(t.title)}</div>
      <div class="done-meta">
        <span class="badge bu-${esc(t.urgency)}">緊急${esc(t.urgency)}</span>
        <span class="badge bi-${esc(t.importance)}">重要${esc(t.importance)}</span>
        ${t.completedAt ? `<span>✅ ${formatDateTimeJP(t.completedAt)}</span>` : ''}
        ${daysStr ? `<span>⏱ ${daysStr}</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

function assigneeBadge(a) {
  if (!a) return '';
  if (a === '山田') return `<span class="badge b-asgn-yamada">🔵 山田</span>`;
  if (a === '自分') return `<span class="badge b-asgn-self">⭐ 自分</span>`;
  return `<span class="badge b-asgn-all">👥 ${esc(a)}</span>`;
}

function taskCard(t) {

  const dlLabel = deadlineLabel(t.deadline);
  const isDone  = t.status === '完了';
  return `<div class="task-item urg-${esc(t.urgency)} ${isDone?'done-item':''}" onclick="openModal('${esc(t.id)}')">
    <div class="t-check ${isDone?'checked':''}" onclick="event.stopPropagation();toggleDone('${esc(t.id)}')"></div>
    <div class="t-body">
      <div class="t-title">${esc(t.title)}</div>

  document.getElementById('f-title').value      = t.title      || '';
  document.getElementById('f-urgency').value    = t.urgency    || '中';
  document.getElementById('f-importance').value = t.importance || '中';
  document.getElementById('f-deadline').value   = today();
  document.getElementById('f-source').value     = t.source     || '自分';
  document.getElementById('f-contact').value    = t.contact    || '';

// ═══════════════════════════════════════════════
//  REPEAT HELPERS
// ═══════════════════════════════════════════════
function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function repeatLabel(repeat) {
  if (!repeat || repeat.type === 'none') return '';
  const DN = ['日','月','火','水','木','金','土'];
  if (repeat.type === 'daily') return '毎日';
  if (repeat.type === 'weekly') {
    const days = (repeat.days || []).map(d => DN[d]).join('・');
    return `毎週（${days || '未設定'}）`;
  }
  if (repeat.type === 'monthly') return `毎月${repeat.day || '?'}日`;
  return '';
}

function nextDeadline(deadline, repeat) {
  if (!repeat || repeat.type === 'none') return '';
  const base = deadline ? new Date(deadline + 'T00:00:00') : new Date();
  if (repeat.type === 'daily') {
    base.setDate(base.getDate() + 1);
    return fmtDate(base);
  }
  if (repeat.type === 'weekly') {
    const days = repeat.days || [];
    if (!days.length) return '';
    const baseDow = base.getDay();
    const sorted = [...days].sort((a, b) => a - b);
    let nextDow = sorted.find(d => d > baseDow);
    let addDays;
    if (nextDow !== undefined) {
      addDays = nextDow - baseDow;
    } else {
      nextDow = sorted[0];
      addDays = 7 - baseDow + nextDow;
    }
    base.setDate(base.getDate() + addDays);
    return fmtDate(base);
  }
  if (repeat.type === 'monthly') {
    const day = repeat.day || 1;
    return fmtDate(new Date(base.getFullYear(), base.getMonth() + 1, day));
  }
  return '';
}

function onRepeatTypeChange() {
  const type = document.getElementById('f-repeat-type').value;
  document.getElementById('repeat-weekly-opts').style.display  = type === 'weekly'  ? '' : 'none';
  document.getElementById('repeat-monthly-opts').style.display = type === 'monthly' ? '' : 'none';
}

function toggleDayChip(btn) {
  btn.classList.toggle('selected');
}

function getRepeatFromForm() {
  const type = document.getElementById('f-repeat-type').value;
  if (type === 'none')    return { type: 'none' };
  if (type === 'daily')   return { type: 'daily' };
  if (type === 'weekly') {
    const days = [];
    document.querySelectorAll('#repeat-weekly-opts .day-chip.selected').forEach(b => {
      days.push(parseInt(b.dataset.day));
    });
    return { type: 'weekly', days };
  }
  if (type === 'monthly') {
    const day = parseInt(document.getElementById('f-repeat-day').value) || 1;
    return { type: 'monthly', day };
  }
  return { type: 'none' };
}

function setRepeatToForm(repeat) {
  const type = (repeat && repeat.type) || 'none';
  const sel = document.getElementById('f-repeat-type');
  if (sel) sel.value = type;
  const wo = document.getElementById('repeat-weekly-opts');
  const mo = document.getElementById('repeat-monthly-opts');
  if (wo) wo.style.display  = type === 'weekly'  ? '' : 'none';
  if (mo) mo.style.display  = type === 'monthly' ? '' : 'none';
  document.querySelectorAll('#repeat-weekly-opts .day-chip').forEach(b => {
    b.classList.toggle('selected', (repeat && repeat.days || []).includes(parseInt(b.dataset.day)));
  });
  const dayInp = document.getElementById('f-repeat-day');
  if (dayInp) dayInp.value = (type === 'monthly' && repeat && repeat.day) ? repeat.day : '';
}

// ═══════════════════════════════════════════════
//  CRUD
// ═══════════════════════════════════════════════
async function saveTask() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { showToast('タイトルを入力してください', 'err'); return; }

  const id = document.getElementById('f-edit-id').value || null;
  const now = new Date().toISOString();

  const task = {
    id:         id || genId(),
    title,
    urgency:    document.getElementById('f-urgency').value,
    importance: document.getElementById('f-importance').value,
    deadline:   document.getElementById('f-deadline').value || '',
    source:     document.getElementById('f-source').value,
    contact:    document.getElementById('f-contact').value.trim(),
    memo:       document.getElementById('f-memo').value.trim(),
    status:     id ? (tasks.find(t=>t.id===id)||{}).status || '未完了' : '未完了',
    createdAt:  id ? (tasks.find(t=>t.id===id)||{}).createdAt || now : now,
    completedAt:id ? (tasks.find(t=>t.id===id)||{}).completedAt || null : null,
    repeat:     getRepeatFromForm(),
    assignee:   id ? (tasks.find(t=>t.id===id)||{}).assignee || '' : '',
    isHabit:    id ? (tasks.find(t=>t.id===id)||{}).isHabit  || false : false,
  };

  await StorageManager.save(task);
  const idx = tasks.findIndex(t => t.id === task.id);
  if (idx >= 0) tasks[idx] = task; else tasks.push(task);

  showToast(id ? 'タスクを更新しました' : 'タスクを追加しました', 'ok');
  editingId = null;
  resetForm();
  nav('main');
}

async function toggleDone(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  const now = new Date().toISOString();
  const wasDone = t.status === '完了';
  t.status = wasDone ? '未完了' : '完了';
  t.completedAt = t.status === '完了' ? now : null;
  await StorageManager.save(t);

  if (!wasDone && t.repeat && t.repeat.type !== 'none') {
    const nextDl = nextDeadline(t.deadline, t.repeat);
    if (nextDl) {
      const nextTask = {
        id: genId(), title: t.title,
        urgency: t.urgency, importance: t.importance,
        deadline: nextDl, source: t.source,
        contact: t.contact || '', memo: t.memo || '',
        status: '未完了', createdAt: now, completedAt: null,
        repeat: t.repeat, assignee: t.assignee || '',
        isHabit: t.isHabit || false,
      };
      await StorageManager.save(nextTask);
      tasks.push(nextTask);
    }
  }

  showToast(t.status === '完了' ? '完了にしました ✅' : '未完了に戻しました', t.status==='完了'?'ok':'');
  refreshCurrentView();
}

async function deleteTask(id) {
  const confirmed = await confirmDialog('このタスクを削除しますか？', '削除する', true);
  if (!confirmed) return;
  await StorageManager.remove(id);
  tasks = tasks.filter(t => t.id !== id);
  document.getElementById('modal-overlay').classList.remove('open');
  showToast('タスクを削除しました');
  refreshCurrentView();
}

async function deleteHabitTasks() {
  const targets = tasks.filter(t => t.isHabit === true || t.id.startsWith('habit_'));
  if (!targets.length) { showToast('習慣タスクは見つかりませんでした'); return; }
  const confirmed = await confirmDialog(`${targets.length}件の習慣タスクを削除します。`, '削除する', true);
  if (!confirmed) return;
  for (const t of targets) await StorageManager.remove(t.id);
  tasks = tasks.filter(t => !(t.isHabit === true || t.id.startsWith('habit_')));
  showToast(`習慣タスク ${targets.length}件 を削除しました`, 'ok');
  refreshCurrentView();
}

async function clearAllData() {
  const confirmed = await confirmDialog('全データを削除します。この操作は取り消せません。本当によろしいですか？', '削除する', true);
  if (!confirmed) return;
  await StorageManager.clear();
  tasks = [];
  showToast('全データを削除しました', 'err');
  renderMain();
}

// Simple confirm using the password dialog as confirm dialog
function confirmDialog(msg, confirmLabel='はい', isDanger=false) {
  return new Promise((resolve) => {
    const overlay = document.getElementById('pwd-overlay');
    const dialog  = document.getElementById('pwd-dialog');
    document.getElementById('pwd-title').textContent = '確認';
    document.getElementById('pwd-desc').textContent  = msg;
    document.getElementById('pwd-input').style.display = 'none';
    const acts = dialog.querySelector('.pwd-acts');
    const btnClass = isDanger ? 'btn-d' : 'btn-p';
    acts.innerHTML = `
      <button class="btn btn-s" style="flex:1" onclick="resolvePwd(false)">キャンセル</button>
      <button class="btn ${btnClass}" style="flex:1" onclick="resolvePwd(true)">${confirmLabel}</button>
    `;
    overlay.classList.add('open');
    pwdResolve = (v) => { resolve(v); resetPwdDialog(); };
  });
}

function resolvePwd(val) {
  if (pwdResolve) {
    const v = val === true ? true : val === false ? false : document.getElementById('pwd-input').value;
    pwdResolve(v);
    pwdResolve = null;
  }
}

function resetPwdDialog() {
  document.getElementById('pwd-overlay').classList.remove('open');
  const dialog = document.getElementById('pwd-dialog');
  document.getElementById('pwd-input').style.display = '';
  document.getElementById('pwd-input').value = '';
  dialog.querySelector('.pwd-acts').innerHTML = `
    <button class="btn btn-s" style="flex:1" onclick="cancelPwd()">キャンセル</button>
    <button class="btn btn-p" style="flex:2" onclick="confirmPwd()">確認</button>
  `;
}

function cancelPwd() {
  if (pwdResolve) { pwdResolve(null); pwdResolve = null; }
  resetPwdDialog();
}

function confirmPwd() {
  resolvePwd('__pwd__');
}

function refreshCurrentView() {
  if      (currentView === 'main')     renderMain();
  else if (currentView === 'settings') renderSecretary();
}

// ═══════════════════════════════════════════════
//  BACKUP — EXPORT
// ═══════════════════════════════════════════════
function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
}

function exportJSON() {
  const data = { version:1, exportedAt: new Date().toISOString(), tasks };
  const now = new Date();
  const dateStr = String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0');
  downloadFile(JSON.stringify(data, null, 2), `task_backup_${dateStr}.json`, 'application/json');
  localStorage.setItem('last_backup_at', new Date().toISOString());
  showToast('JSONファイルをダウンロードしました', 'ok');
}

async function exportEncrypted() {
  const password = await askPassword('暗号化パスワードを設定', 'バックアップファイルを暗号化するパスワードを入力してください。復元時に必要になります。');
  if (!password) return;
  if (password.length < 4) { showToast('パスワードは4文字以上にしてください', 'err'); return; }
  try {
    const data    = { version:1, exportedAt: new Date().toISOString(), tasks };
    const enc     = await CryptoManager.encrypt(data, password);
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    downloadFile(enc, `tasks_backup_${stamp}.enc`, 'application/octet-stream');
    localStorage.setItem('last_backup_at', new Date().toISOString());
    showToast('暗号化ファイルをダウンロードしました 🔒', 'ok');
  } catch(e) {
    showToast('暗号化に失敗しました', 'err');
  }
}

// ═══════════════════════════════════════════════
//  BACKUP — IMPORT
// ═══════════════════════════════════════════════
async function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    const imported = Array.isArray(data) ? data : (data.tasks || []);
    if (!imported.length) { showToast('インポートするタスクがありませんでした', 'err'); return; }
    const confirmed = await confirmDialog(`${imported.length}件のタスクをインポートします。既存データに追加されます。`, 'インポート');
    if (!confirmed) return;
    for (const t of imported) {
      if (!t.id || !t.title) continue;
      await StorageManager.save(t);
      const idx = tasks.findIndex(x => x.id === t.id);
      if (idx >= 0) tasks[idx] = t; else tasks.push(t);
    }
    showToast(`${imported.length}件をインポートしました`, 'ok');
    renderMain();
  } catch(e) {
    showToast('JSONの読み込みに失敗しました', 'err');
  }
}

async function importEncrypted(event) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';
  const password = await askPassword('復号パスワードを入力', 'バックアップ時に設定したパスワードを入力してください。');
  if (!password) return;
  try {
    const text = await file.text();
    const data = await CryptoManager.decrypt(text.trim(), password);
    const imported = Array.isArray(data) ? data : (data.tasks || []);
    if (!imported.length) { showToast('インポートするタスクがありませんでした', 'err'); return; }
    const confirmed = await confirmDialog(`${imported.length}件のタスクをインポートします。既存データに追加されます。`, 'インポート');
    if (!confirmed) return;
    for (const t of imported) {
      if (!t.id || !t.title) continue;
      await StorageManager.save(t);
      const idx = tasks.findIndex(x => x.id === t.id);
      if (idx >= 0) tasks[idx] = t; else tasks.push(t);
    }
    showToast(`${imported.length}件をインポートしました 🔓`, 'ok');
    renderMain();
  } catch(e) {
    showToast('復号に失敗しました。パスワードを確認してください', 'err');
  }
}

// ═══════════════════════════════════════════════
//  PASSWORD PROMPT (no prompt())
// ═══════════════════════════════════════════════
function askPassword(title, desc) {
  return new Promise((resolve) => {
    document.getElementById('pwd-title').textContent = title;
    document.getElementById('pwd-desc').textContent  = desc;
    document.getElementById('pwd-input').style.display = '';
    document.getElementById('pwd-input').value = '';
    const acts = document.getElementById('pwd-dialog').querySelector('.pwd-acts');
    acts.innerHTML = `
      <button class="btn btn-s" style="flex:1" onclick="cancelPwd()">キャンセル</button>
      <button class="btn btn-p" style="flex:2" onclick="confirmPwd()">確認</button>
    `;
    document.getElementById('pwd-overlay').classList.add('open');

    pwdResolve = (v) => {
      if (v === '__pwd__') {
        const pw = document.getElementById('pwd-input').value;
        resetPwdDialog();
        resolve(pw || null);
      } else {
        resetPwdDialog();
        resolve(null);
      }
      pwdResolve = null;
    };

    // Allow Enter key
    const inp = document.getElementById('pwd-input');
    inp.onkeydown = (e) => { if (e.key === 'Enter') confirmPwd(); };
    setTimeout(() => inp.focus(), 100);
  });
}

function checkBackupReminder() {
  if (new Date().getDay() !== 5) return;
  const last = localStorage.getItem('last_backup_at');
  const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
  if (last && new Date(last).getTime() >= sevenDaysAgo) return;
  const c = document.getElementById('toast-cont');
  const t = document.createElement('div');
  t.className = 'toast err';
  t.textContent = '📦 今週のバックアップを忘れずに！';
  c.appendChild(t);
  setTimeout(() => t.remove(), 6000);
}

// ═══════════════════════════════════════════════
async function migrateHabitTasks() {
  const MIGRATED_KEY = 'habit_migrated_v1';
  if (localStorage.getItem(MIGRATED_KEY)) return;

  const now = new Date().toISOString();
  const todayStr = today();
  let added = 0;

  for (const h of HABIT_DEFINITIONS) {
    if (tasks.find(t => t.habitKey === h.key)) continue;

    let repeat;
    if      (h.schedule === 'daily')         repeat = { type: 'daily' };
    else if (h.schedule === 'weekday')       repeat = { type: 'weekly', days: [h.day] };
    else if (h.schedule === 'monthly_week1') repeat = { type: 'monthly', day: 1 };
    else                                     repeat = { type: 'none' };

    const task = {
      id: genId(), title: h.title,
      urgency: h.urgency, importance: h.importance,
      deadline: todayStr, source: '習慣', contact: '', memo: '',
      status: '未完了', createdAt: now, completedAt: null,
      repeat, isHabit: true, habitKey: h.key,
    };
    await StorageManager.save(task);
    tasks.push(task);
    added++;
  }

  localStorage.setItem(MIGRATED_KEY, '1');
  if (added > 0) refreshCurrentView();
}

async function cleanLegacyHabitTasks(force = false) {
  const CLEAN_KEY = 'habit_cleaned_v2';
  const flagVal = localStorage.getItem(CLEAN_KEY);
  console.log(`[habit cleanup] フラグ '${CLEAN_KEY}': ${JSON.stringify(flagVal)} | tasks総数: ${tasks.length}`);

  if (!force && flagVal) {
    console.log('[habit cleanup] フラグあり → スキップ。強制実行はコンソールで forceCleanHabits() を実行');
    return;
  }

  // 削除条件: 旧IDプレフィックス OR isHabit:true
  const toDelete = tasks.filter(t => t.id.startsWith('habit_') || t.isHabit === true);
  console.log(`[habit cleanup] 削除対象: ${toDelete.length}件`,
    toDelete.map(t => ({ id: t.id, title: t.title, isHabit: t.isHabit })));

  for (const t of toDelete) {
    await StorageManager.remove(t.id);
  }
  tasks = tasks.filter(t => !(t.id.startsWith('habit_') || t.isHabit === true));

  localStorage.setItem(CLEAN_KEY, '1');
  console.log(`[habit cleanup] 完了: ${toDelete.length}件削除 / 残り: ${tasks.length}件`);

  if (toDelete.length > 0) {
    showToast(`古い習慣タスク ${toDelete.length}件 を整理しました`);
    refreshCurrentView();
  }
}

// デバッグ用: ブラウザコンソールで forceCleanHabits() を実行すると強制削除
async function forceCleanHabits() {
  console.log('[habit cleanup] 強制実行モード — フラグをリセットしてクリーンアップ');
  localStorage.removeItem('habit_cleaned_v1');
  localStorage.removeItem('habit_cleaned_v2');
  tasks = await StorageManager.getAll();
  await cleanLegacyHabitTasks(true);
}

function watchDateChange() {
  let lastDate = today();
  setInterval(() => {
    const now = today();
    if (now !== lastDate) { lastDate = now; }
  }, 60000);
}

async function applyBoardContent() {

  const { tasks: parsed, points } = parseClaudeReply(text);

  for (const pt of parsed) {

    const task = {
      id: genId(), title: pt.title,
      urgency: pt.urgency, importance: pt.importance,

      status: '未完了', createdAt: new Date().toISOString(), completedAt: null,

function parseClaudeReply(text) {
  const taskSec  = text.match(/【タスク】([\s\S]*?)(?=【|$)/);
  const pointSec = text.match(/【要点】([\s\S]*?)(?=【|$)/);
  const parsedTasks = [];
  const points = [];
  if (taskSec) {
    for (const line of taskSec[1].split('\n')) {
      const c = line.replace(/^[\s・\-•*]+/, '').trim();
      if (c) parsedTasks.push(parseTaskLine(c));
    }
  }
  if (pointSec) {
    for (const line of pointSec[1].split('\n')) {
      const c = line.replace(/^[\s・\-•*]+/, '').trim();
      if (c) points.push(c);
    }
  }
  return { tasks: parsedTasks, points };
}

// 相対日付・具体日付を YYYY-MM-DD に変換（未定は '' を返す）
function relativeToDate(text) {
  if (!text) return '';
  const t = text.trim();
  if (/未定|不明/.test(t)) return '';

  const now = new Date();
  const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const add = (n) => { const d = new Date(now); d.setDate(d.getDate()+n); return fmt(d); };
  // 今週の月曜からのオフセットで「来週の X 曜日」を計算
  const nextWeekDay = (dow) => {
    const d = new Date(now);
    const day = d.getDay();
    const diffToMon = (day === 0) ? -6 : 1 - day; // 今週月曜への差分
    d.setDate(d.getDate() + diffToMon + 7 + dow);  // 来週月曜+dow
    return fmt(d);
  };

  if (/今日|本日/.test(t))  return today();
  if (/明後日/.test(t))     return add(2);
  if (/明日/.test(t))       return add(1);
  if (/今週|週内/.test(t))  return weekEnd();
  if (/来週.*月曜|来週月/.test(t))  return nextWeekDay(0);
  if (/来週.*火曜|来週火/.test(t))  return nextWeekDay(1);
  if (/来週.*水曜|来週水/.test(t))  return nextWeekDay(2);
  if (/来週.*木曜|来週木/.test(t))  return nextWeekDay(3);
  if (/来週.*金曜|来週金/.test(t))  return nextWeekDay(4);
  if (/来週中/.test(t))             return nextWeekDay(4); // 来週金曜
  if (/来週/.test(t))               return nextWeekDay(0); // デフォルト来週月曜
  if (/連休明け|GW明け|ゴールデンウィーク明け/.test(t)) return `${now.getFullYear()}-05-07`;
  if (/今月末/.test(t)) return fmt(new Date(now.getFullYear(), now.getMonth()+1, 0));

  // X月末
  const me = t.match(/(\d{1,2})月末/);
  if (me) {
    const m = parseInt(me[1]);
    let y = now.getFullYear();
    if (m < now.getMonth()+1) y++;
    return fmt(new Date(y, m, 0));
  }

  // YYYY/MM/DD または YYYY-MM-DD
  const full = t.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (full) return `${full[1]}-${full[2].padStart(2,'0')}-${full[3].padStart(2,'0')}`;

  // M/D、M／D（全角スラッシュ）、M月D日
  const dm = t.match(/(\d{1,2})[\/／月](\d{1,2})/);
  if (dm) {
    const m = parseInt(dm[1]), day = parseInt(dm[2]);
    let y = now.getFullYear();
    const test = new Date(y, m-1, day);
    if (test < now && test.getMonth() === m-1) y++;
    return `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }
  return '';
}

// タスク行をパース（タスク名｜期限｜優先度｜担当｜詳細 形式対応）
function parseTaskLine(text) {
  const parts = text.split('｜').map(s => s.trim());
  const rawTitle    = parts[0] || text;
  const rawDeadline = parts[1] || '';
  const rawUrgency  = parts[2] || '';
  const rawAssignee = parts[3] || '';
  const rawMemo     = parts[4] || '';

  let urgency = '中';
  if (/高/.test(rawUrgency) || /至急|緊急/.test(rawTitle)) urgency = '高';
  else if (/低/.test(rawUrgency)) urgency = '低';

  // 未定 → '' 、解析不能 → today() をフォールバック
  let deadline;
  if (/未定|不明/.test(rawDeadline)) {
    deadline = '';
  } else {
    deadline = relativeToDate(rawDeadline) || relativeToDate(rawTitle) || today();
  }

  const title = rawTitle.replace(/（[^）]*）/g,'').replace(/\([^)]*\)/g,'').trim() || rawTitle;
  return { title, urgency, importance: '中', deadline, assignee: rawAssignee, memo: rawMemo };
}
