<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg192" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16435A"/>
      <stop offset="100%" stop-color="#2A7FA0"/>
    </linearGradient>
    <linearGradient id="hdr192" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E5A70"/>
      <stop offset="100%" stop-color="#2D8FA8"/>
    </linearGradient>
    <linearGradient id="badge192" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#56C25A"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <clipPath id="clip192">
      <rect width="100" height="100" rx="22"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg192)"/>

  <g clip-path="url(#clip192)">
    <!-- Clipboard shadow -->
    <rect x="12" y="14" width="62" height="71" rx="7" fill="rgba(0,0,0,0.22)"/>

    <!-- Clipboard body -->
    <rect x="10" y="12" width="62" height="71" rx="7" fill="white"/>

    <!-- Header band -->
    <rect x="10" y="12" width="62" height="20" rx="7" fill="url(#hdr192)"/>
    <!-- Square off bottom two corners of header -->
    <rect x="10" y="23" width="62" height="9" fill="#2D8FA8"/>

    <!-- Title white lines (suggests "task list" label) -->
    <rect x="18" y="17" width="30" height="5.5" rx="2.75" fill="rgba(255,255,255,0.95)"/>
    <rect x="18" y="25"  width="19" height="4"   rx="2"    fill="rgba(255,255,255,0.5)"/>

    <!-- Separator -->
    <line x1="10" y1="32" x2="72" y2="32" stroke="#ECEFF1" stroke-width="1.3"/>

    <!-- ── Row 1: HIGH priority · DONE ── -->
    <!-- Priority dot (red) -->
    <circle cx="19" cy="42" r="4.5" fill="#EF5350"/>
    <!-- Checked box -->
    <rect x="28" y="37.5" width="10.5" height="10.5" rx="3" fill="#2D7D9A"/>
    <polyline points="29.5,42.5 32.5,46.5 38.5,38.5"
              fill="none" stroke="white" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Text bar -->
    <rect x="43" y="39.5" width="24" height="5.5" rx="2.75" fill="#B0BEC5"/>

    <!-- ── Row 2: MED priority · DONE ── -->
    <circle cx="19" cy="57" r="4.5" fill="#FFA726"/>
    <rect x="28" y="52.5" width="10.5" height="10.5" rx="3" fill="#2D7D9A"/>
    <polyline points="29.5,57.5 32.5,61.5 38.5,53.5"
              fill="none" stroke="white" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="43" y="54.5" width="18" height="5.5" rx="2.75" fill="#B0BEC5"/>

    <!-- ── Row 3: LOW priority · PENDING ── -->
    <circle cx="19" cy="72" r="4.5" fill="#66BB6A"/>
    <rect x="28" y="67.5" width="10.5" height="10.5" rx="3"
          fill="none" stroke="#CFD8DC" stroke-width="2"/>
    <rect x="43" y="69.5" width="27" height="5.5" rx="2.75" fill="#ECEFF1"/>

    <!-- ── Green completion badge (bottom-right) ── -->
    <!-- Outer glow / shadow -->
    <circle cx="75" cy="76" r="20" fill="rgba(0,0,0,0.18)"/>
    <!-- Badge body -->
    <circle cx="75" cy="75" r="20" fill="url(#badge192)"/>
    <!-- Inner highlight ring -->
    <circle cx="75" cy="75" r="20" fill="none"
            stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <!-- Bold white checkmark -->
    <polyline points="64,75 72,83 87,62"
              fill="none" stroke="white" stroke-width="5.5"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
