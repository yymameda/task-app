<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg192" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A4F63"/>
      <stop offset="100%" stop-color="#2E8FAD"/>
    </linearGradient>
    <linearGradient id="penc192" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg192)"/>

  <!-- Clipboard shadow -->
  <rect x="16" y="21" width="56" height="66" rx="7" fill="rgba(0,0,0,0.18)"/>

  <!-- Clipboard body (white paper) -->
  <rect x="14" y="18" width="56" height="66" rx="7" fill="white"/>

  <!-- Clip holder at top center -->
  <rect x="30" y="12" width="24" height="13" rx="5" fill="#78909C"/>
  <rect x="33" y="14" width="18" height="8" rx="3" fill="#546E7A"/>

  <!-- Divider line under clip -->
  <line x1="14" y1="29.5" x2="70" y2="29.5" stroke="#ECEFF1" stroke-width="1.5"/>

  <!-- Row 1 — DONE (blue checkbox + check + grey bar) -->
  <rect x="21" y="36" width="11" height="11" rx="3" fill="#2D7D9A"/>
  <polyline points="22.5,41.5 25.5,45 33,37"
            fill="none" stroke="white" stroke-width="2.3"
            stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="37" y="38.5" width="27" height="6" rx="3" fill="#90A4AE"/>

  <!-- Row 2 — DONE -->
  <rect x="21" y="52" width="11" height="11" rx="3" fill="#2D7D9A"/>
  <polyline points="22.5,57.5 25.5,61 33,53"
            fill="none" stroke="white" stroke-width="2.3"
            stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="37" y="54.5" width="21" height="6" rx="3" fill="#90A4AE"/>

  <!-- Row 3 — PENDING (empty checkbox + lighter bar) -->
  <rect x="21" y="68" width="11" height="11" rx="3"
        fill="none" stroke="#CFD8DC" stroke-width="2"/>
  <rect x="37" y="70.5" width="29" height="6" rx="3" fill="#ECEFF1"/>

  <!--
    Pencil: translate(74,78) rotate(-45)
    rotate(-45) maps local (0,y) → world (74+y·sin45, 78+y·cos45)
    Tip  (y=+18) → world ≈ (86.7, 90.7)   [lower-right corner ✓]
    Eraser (y=−30) → world ≈ (52.8, 56.8) [overlapping clipboard ✓]
  -->
  <g transform="translate(74,78) rotate(-45)">
    <!-- Eraser (pink) -->
    <rect x="-5" y="-30" width="10" height="6" rx="2.5" fill="#EF9A9A"/>
    <!-- Ferrule / metal band (silver) -->
    <rect x="-5" y="-25" width="10" height="5" fill="#B0BEC5"/>
    <!-- Body (yellow gradient) -->
    <rect x="-5" y="-21" width="10" height="29" rx="2" fill="url(#penc192)"/>
    <!-- Pencil tip — wood -->
    <polygon points="-5,8 5,8 0,18" fill="#C99A5A"/>
    <!-- Pencil tip — graphite -->
    <polygon points="-1.8,14 1.8,14 0,18" fill="#37474F"/>
    <!-- Shine highlight on body -->
    <rect x="-2.5" y="-19" width="3.5" height="24" rx="1.5" fill="rgba(255,255,255,0.4)"/>
    <!-- Right edge shadow for 3D depth -->
    <line x1="5" y1="-21" x2="5" y2="8" stroke="rgba(0,0,0,0.14)" stroke-width="1.2"/>
  </g>
</svg>
